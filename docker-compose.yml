services:
  api:
    build: .
    command: ["uv", "run", "uvicorn", "app.fast_api_app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    ports: ["8080:8080"]
    volumes:
      - source_artifacts:/code/data/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - source_artifacts:/code/data/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tariff_monitor
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-test:
    image: pgvector/pgvector:pg17
    profiles: ["test"]
    environment:
      POSTGRES_DB: tariff_monitor_test
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
    ports: ["127.0.0.1:5433:5432"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff_monitor_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  source_artifacts:
