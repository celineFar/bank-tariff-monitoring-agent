services:
  api:
    build: .
    command: ["uv", "run", "uvicorn", "app.fast_api_app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      LOG_FILE: /var/log/tariff-monitor/api.log
    volumes:
      - ./logs:/var/log/tariff-monitor
      - ./artifacts/pipeline-audit:/code/artifacts/pipeline-audit
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "app.worker"]
    env_file: .env
    environment:
      LOG_FILE: /var/log/tariff-monitor/worker.log
    volumes:
      - ./logs:/var/log/tariff-monitor
      - ./artifacts/pipeline-audit:/code/artifacts/pipeline-audit
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tariff_monitor
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-test:
    image: pgvector/pgvector:pg17
    profiles: ["test"]
    environment:
      POSTGRES_DB: tariff_monitor_test
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
    ports: ["5433:5432"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff_monitor_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
