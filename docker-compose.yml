services:
  api:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uv", "run", "--no-sync", "uvicorn", "app.fast_api_app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
    ports: ["8080:8080"]
    volumes:
      - ./data/artifacts:/code/data/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    env_file: .env
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/artifacts:/code/data/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    profiles: ["tools"]
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uv", "run", "--no-sync", "python", "scripts/discover_and_ingest_sources.py", "--pretty"]
    env_file: .env
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/artifacts:/code/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tariff_monitor
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
    ports: ["5434:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-test:
    image: pgvector/pgvector:pg17
    profiles: ["test"]
    environment:
      POSTGRES_DB: tariff_monitor_test
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
    ports: ["127.0.0.1:5433:5432"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff_monitor_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
